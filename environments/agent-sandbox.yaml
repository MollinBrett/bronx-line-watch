# Sandbox the maintenance agents run in. Deny-by-default networking:
# npm (to install and test), the agents' MCP servers (GitHub), GitHub itself,
# and the MTA feed (to check live data when debugging). Nothing else.
name: bronx-line-watch-sandbox
config:
  type: cloud
  networking:
    type: limited
    allow_package_managers: true
    allow_mcp_servers: true
    allowed_hosts:
      - github.com
      - api.github.com
      - api-endpoint.mta.info
